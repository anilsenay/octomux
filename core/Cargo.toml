[workspace]
resolver = "2"
members = ["crates/octomux-proto", "crates/octomux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
libc = "0.2"

[profile.release]
debug = 1
