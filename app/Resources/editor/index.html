<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --code-size: 12px;
  --bg: #1b1b1d; --raised: #232326; --text: #e6e6e8; --text2: #a9a9ae; --text3: #6f6f75;
  --border: rgba(255,255,255,0.08); --hover: rgba(255,255,255,0.04); --hover2: rgba(255,255,255,0.08);
  --selection: rgba(110,150,255,0.30);
  --accent: #7c8cff; --green: #4fc27a; --red: #f0606a; --blue: #6aa6ff; --amber: #e5b04a;
  --add-bg: rgba(79,194,122,0.12); --add-word: rgba(79,194,122,0.28);
  --del-bg: rgba(240,96,106,0.12); --del-word: rgba(240,96,106,0.30);
  --hunk-bg: rgba(106,166,255,0.08);
  --syn-keyword: #c792ea; --syn-string: #a5d6a7; --syn-number: #f5a97f; --syn-comment: #6f7a86;
  --syn-func: #82aaff; --syn-type: #ffcb6b; --syn-prop: #9ecbff; --syn-tag: #f07178; --syn-def: #e6e6e8; --syn-meta: #89ddff;
}
:root:not(.dark) {
  --syn-keyword: #8b3fd1; --syn-string: #2f7d3a; --syn-number: #b45309; --syn-comment: #8a8f98;
  --syn-func: #1d5fd1; --syn-type: #a05a00; --syn-prop: #0b6e99; --syn-tag: #c0283a; --syn-def: #1d1d1f; --syn-meta: #0a7f8f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--text); font: 12.5px/1.4 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
#root { height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--hover2); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

.bar { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--border); flex: none; user-select: none; -webkit-user-select: none; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; color: var(--text3); font-size: 12px; white-space: nowrap; overflow: hidden; }
.crumbs .leaf { color: var(--text); font-weight: 500; }
.crumbs .sep { opacity: .6; }
.crumbs .title { color: var(--text2); }
.right { display: flex; align-items: center; gap: 10px; flex: none; }
.status { color: var(--amber); font-size: 11.5px; }
.count { color: var(--text3); font-size: 11.5px; }
.seg { display: flex; padding: 2px; border-radius: 7px; background: var(--hover); border: 1px solid var(--border); }
.seg button { padding: 2px 9px; border-radius: 5px; color: var(--text3); font-size: 11.5px; }
.seg button:hover { color: var(--text2); }
.seg button.on { background: var(--hover2); color: var(--text); }
.link { color: var(--text2); font-size: 12px; padding: 2px 4px; border-radius: 5px; }
.link:hover { color: var(--text); background: var(--hover); }

.file, .diff { display: flex; flex-direction: column; height: 100%; }
.file .body { flex: 1; min-height: 0; position: relative; }
.editor, .editor .cm-editor { height: 100%; }
.editor .cm-editor.cm-focused { outline: none; }
.fold { display: inline-block; width: 10px; text-align: center; opacity: .7; }
.notice { color: var(--text3); padding: 40px; text-align: center; }
.notice.small { padding: 10px 14px; text-align: left; font-size: 12px; }

.markdown { height: 100%; overflow: auto; padding: 22px 34px 60px; font-size: 14px; line-height: 1.65; max-width: 920px; }
.markdown h1, .markdown h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.markdown h1 { font-size: 1.8em; } .markdown h2 { font-size: 1.4em; } .markdown h3 { font-size: 1.15em; }
.markdown a { color: var(--blue); text-decoration: none; } .markdown a:hover { text-decoration: underline; }
.markdown code { font-family: var(--mono); font-size: .88em; background: var(--hover2); padding: .15em .35em; border-radius: 4px; }
.markdown pre { background: var(--hover); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow: auto; line-height: 1.45; }
.markdown pre code { background: none; padding: 0; font-size: 12px; }
.markdown blockquote { margin: 0; padding: 0 1em; color: var(--text2); border-left: 3px solid var(--border); }
.markdown table { border-collapse: collapse; } .markdown th, .markdown td { border: 1px solid var(--border); padding: 5px 10px; }
.markdown img { max-width: 100%; } .markdown hr { border: 0; border-top: 1px solid var(--border); }

.diff .list { flex: 1; overflow: auto; padding: 8px 10px 40px; position: relative; }
.section { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 12px; font-weight: 600; padding: 10px 4px 6px; }
.stat { display: inline-flex; gap: 6px; font-family: var(--mono); font-size: 11.5px; font-weight: 500; }
.plus { color: var(--green); } .minus { color: var(--red); }
.card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--hover); overflow: clip; transition: box-shadow .3s; }
/* clip, not hidden: hidden makes the card a scroll box and its header would stop sticking to the list's top */
.card.flash { box-shadow: 0 0 0 2px var(--accent); }
.card .head { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 10px; cursor: pointer; user-select: none; -webkit-user-select: none; position: sticky; top: -8px; z-index: 5; background: var(--raised); border-bottom: 1px solid var(--border); }
.card.collapsed .head { border-bottom: 0; }
.card .head:hover { background: color-mix(in srgb, var(--raised) 85%, var(--text) 4%); }
.chev { width: 12px; color: var(--text3); display: inline-block; transform: rotate(90deg); transition: transform .12s; font-size: 13px; text-align: center; }
.card.collapsed .chev { transform: rotate(0); }
.badge { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 12px; }
.badge.add { color: var(--green); } .badge.del { color: var(--red); } .badge.mod { color: var(--amber); } .badge.ren { color: var(--blue); }
.name { color: var(--text); font-weight: 600; white-space: nowrap; }
.dir { color: var(--text3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.open { color: var(--text3); font-size: 11.5px; padding: 2px 7px; border-radius: 5px; opacity: 0; }
.card .head:hover .open { opacity: 1; }
.open:hover { color: var(--text); background: var(--hover2); }
.card.collapsed .cbody { display: none; }
.cbody { background: var(--bg); min-height: 20px; }
.cbody .cm-mergeView, .cbody .cm-editor { max-height: none; }
.cbody .cm-mergeViewEditors { display: flex; }
.cbody .cm-mergeViewEditor { flex: 1; min-width: 0; }
.cbody .cm-mergeViewEditors > .cm-mergeViewEditor:first-child { flex: 0 0 calc(var(--split, 50%) - 4px) !important; }
.cbody .cm-mergeViewEditors > .cm-mergeViewEditor:last-child { flex: 1 1 0 !important; }
.split-handle { flex: 0 0 8px; cursor: col-resize; position: relative; touch-action: none; }
.split-handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3.5px; width: 1px; background: var(--border); transition: background .12s, width .12s, left .12s; }
.split-handle:hover::after, .split-handle.dragging::after { background: var(--accent); width: 2px; left: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="editor.js"></script>
</body>
</html>
