[package]
name = "proto-b"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ade-proto = { path = "../../core/crates/ade-proto" }
vt100 = "0.16"
serde_json = "1"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9" }

[features]
# Lets verify.sh capture the window via GPUI's own offscreen render
# (no Screen Recording permission needed).
selfshot = ["gpui_platform/test-support", "dep:image"]

[workspace]
resolver = "2"
