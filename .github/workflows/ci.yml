name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  core:
    name: Rust core (daemon, holder, CLI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo build --locked
        working-directory: core
      - run: cargo test --locked
        working-directory: core
        env: { OCTOMUX_NO_USAGE_PROBE: "1" }

  app:
    name: macOS app (Swift)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # libghostty at the commit pinned in tools/build-ghostty.sh, built once per pin.
      - id: ghostty
        run: echo "commit=$(sed -n 's/^GHOSTTY_COMMIT=\([0-9a-f]*\).*/\1/p' tools/build-ghostty.sh)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/GhosttyKit.xcframework
          key: ghosttykit-native-${{ steps.ghostty.outputs.commit }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          GHOSTTY_TARGET=native tools/build-ghostty.sh
      # Saved right away, so a later failing step doesn't throw the build away.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/GhosttyKit.xcframework
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - run: swift build
        working-directory: app
      - run: swift test
        working-directory: app
